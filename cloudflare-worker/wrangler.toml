name = "marocfly-duffel-proxy"
main = "src/index.js"
compatibility_date = "2026-01-01"

# DUFFEL_API_KEY, MISTRAL_API_KEY, FIREBASE_SERVICE_ACCOUNT_EMAIL and
# FIREBASE_SERVICE_ACCOUNT_KEY are NOT set here - they're secrets, pushed
# via `wrangler secret put <NAME>` (see the GitHub Actions workflow),
# never committed to this file or to git. MISTRAL_API_KEY and the two
# FIREBASE_SERVICE_ACCOUNT_* secrets are optional - /ai/chat falls back to
# Workers AI below when the former is unset, and the scheduled price-check
# job (price_check_job.js) just skips its run when the latter two aren't
# both set.

# Real, server-side price-drop notifications (see price_check_job.js) -
# fires on this schedule regardless of whether anyone has the app open.
# Every 15 minutes per explicit request, to get as close to "instant" as a
# request/response API allows - no flight-price provider (Duffel included)
# pushes a live event the moment a fare changes, so polling more often is
# the only lever there is. Each run makes one Duffel search per tracked
# alert, so this is a real 24x jump in Duffel API call volume versus the
# previous 6h interval - worth watching for Duffel rate-limit errors in
# the Worker logs if the number of tracked alerts grows.
[triggers]
crons = ["*/15 * * * *"]

# Workers AI: runs open-source LLMs (Llama 3.1, etc.) directly on
# Cloudflare's infrastructure. This binding needs no separate API key/
# signup - it uses the same Cloudflare account already deploying this
# Worker - and has a free daily quota (10,000 "neurons"/day as of this
# writing), which is what powers the AI chat's natural-language replies.
[ai]
binding = "AI"
