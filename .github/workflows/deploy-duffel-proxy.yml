name: Deploy Duffel proxy to Cloudflare Workers

on:
  push:
    branches:
      - claude/marocfly-ai-travel-app-ci1ebu
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-duffel-proxy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Set Duffel API key as a Cloudflare secret
        run: echo "${{ secrets.DUFFEL_API_KEY }}" | wrangler secret put DUFFEL_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Diagnostic only - GitHub's runner has real network access (unlike
      # the dev sandbox this Worker is usually edited from), so this is how
      # we find out whether Workers AI is actually reachable/enabled on the
      # account, without needing anyone to test from the live app first.
      - name: Smoke-test the /ai/chat endpoint
        run: |
          curl -sS -X POST https://marocfly-duffel-proxy.bakr1100.workers.dev/ai/chat \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"system","content":"Reply with exactly: OK"},{"role":"user","content":"ping"}]}' \
            -w "\nHTTP_STATUS:%{http_code}\n"
        continue-on-error: true

      # Temporary, one-off diagnostic - not needed once CHAT_MODEL in
      # src/index.js is confirmed working again. Lists currently-available
      # (non-deprecated) Workers AI text-generation models directly from
      # Cloudflare's API, since the deploy sandbox this Worker is normally
      # edited from has no network access to check this any other way.
      - name: List available Workers AI text-generation models
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/models/search?task=Text%20Generation&per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
