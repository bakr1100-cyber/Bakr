name: Deploy Duffel proxy to Cloudflare Workers

on:
  push:
    branches:
      - claude/marocfly-ai-travel-app-ci1ebu
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-duffel-proxy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Set Duffel API key as a Cloudflare secret
        run: echo "${{ secrets.DUFFEL_API_KEY }}" | wrangler secret put DUFFEL_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Kept permanently (not just diagnostic) - catches a broken AI chat
      # backend (e.g. a deprecated model) right at deploy time, in the
      # Actions log, instead of only being discovered by a user seeing a
      # silent fallback to template replies in the live app. GitHub's
      # runner also has real network access, unlike the dev sandbox this
      # Worker is normally edited from.
      - name: Smoke-test the /ai/chat endpoint
        run: |
          curl -sS -X POST https://marocfly-duffel-proxy.bakr1100.workers.dev/ai/chat \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"system","content":"Reply with exactly: OK"},{"role":"user","content":"ping"}]}' \
            -w "\nHTTP_STATUS:%{http_code}\n"
        continue-on-error: true

      # Temporary, one-off diagnostic - the deploy token's scope doesn't
      # include the Cloudflare account API's AI-models-list endpoint, so
      # this scrapes Cloudflare's public model catalog page instead (no
      # auth needed) to find a currently-valid model ID to replace a
      # deprecated CHAT_MODEL in src/index.js.
      - name: List current Workers AI chat model IDs from public docs
        run: |
          curl -sS "https://developers.cloudflare.com/workers-ai/models/" | grep -oE '@cf/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+' | sort -u
        continue-on-error: true
