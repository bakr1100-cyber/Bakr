name: Deploy Duffel proxy to Cloudflare Workers

on:
  push:
    branches:
      - claude/marocfly-ai-travel-app-ci1ebu
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-duffel-proxy.yml'
  # workflow_dispatch is also declared below, but the GitHub API's
  # /dispatches endpoint has intermittently 500'd for this workflow -
  # pushing a no-op change to this file (matching the path filter above)
  # is a reliable fallback trigger when that happens.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Set Duffel API key as a Cloudflare secret
        run: echo "${{ secrets.DUFFEL_API_KEY }}" | wrangler secret put DUFFEL_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Optional: /ai/chat falls back to Workers AI (below) when this
      # secret doesn't exist yet - safe to run unconditionally, an empty
      # value is treated the same as "not configured" by the Worker.
      - name: Set Mistral API key as a Cloudflare secret
        run: echo "${{ secrets.MISTRAL_API_KEY }}" | wrangler secret put MISTRAL_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Optional: the scheduled price-check job (price_check_job.js) just
      # skips its run when these aren't set - safe to run unconditionally,
      # same as the Mistral key above. See google_auth.js for exactly what
      # these two values need to be (a Firebase/Google Cloud service
      # account's "client_email" and "private_key").
      - name: Set Firebase service account email as a Cloudflare secret
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMAIL }}" | wrangler secret put FIREBASE_SERVICE_ACCOUNT_EMAIL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Firebase service account key as a Cloudflare secret
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | wrangler secret put FIREBASE_SERVICE_ACCOUNT_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Kept permanently (not just diagnostic) - catches a broken AI chat
      # backend (e.g. a deprecated model) right at deploy time, in the
      # Actions log, instead of only being discovered by a user seeing a
      # silent fallback to template replies in the live app. GitHub's
      # runner also has real network access, unlike the dev sandbox this
      # Worker is normally edited from.
      - name: Smoke-test the /ai/chat endpoint
        run: |
          curl -sS -X POST https://marocfly-duffel-proxy.bakr1100.workers.dev/ai/chat \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"system","content":"Reply with exactly: OK"},{"role":"user","content":"ping"}]}' \
            -w "\nHTTP_STATUS:%{http_code}\nTOTAL_TIME:%{time_total}s\n" \
            --max-time 20
        continue-on-error: true

      # Same rationale as the /ai/chat smoke test above: catches an
      # invalid/expired DUFFEL_API_KEY or a Duffel-side outage right at
      # deploy time, in the Actions log, rather than only being discovered
      # by a user always seeing mock prices with no clue why. Uses the
      # exact request shape DuffelFlightApi sends (see
      # lib/services/duffel_flight_api.dart) against a real, well-covered
      # route (Paris CDG -> Casablanca CMN) 30 days out.
      - name: Smoke-test the /air/offer_requests endpoint (real Duffel flight search)
        run: |
          departure_date=$(date -u -d '+30 days' +%Y-%m-%d)
          curl -sS -X POST "https://marocfly-duffel-proxy.bakr1100.workers.dev/air/offer_requests?return_offers=true" \
            -H "Content-Type: application/json" \
            -H "Duffel-Version: v2" \
            -d "{\"data\":{\"slices\":[{\"origin\":\"CDG\",\"destination\":\"CMN\",\"departure_date\":\"$departure_date\"}],\"passengers\":[{\"type\":\"adult\"}],\"cabin_class\":\"economy\"}}" \
            -o duffel.json \
            -w "\nHTTP_STATUS:%{http_code}\nTOTAL_TIME:%{time_total}s\n" \
            --max-time 25
          # THE thing worth checking here, and the reason the raw body is no
          # longer dumped: a `duffel_test_` token returns a complete,
          # realistic-looking response whose prices are simulated. Only
          # `live_mode: true` means these are prices a traveller could
          # actually pay. See todo/duffel-live-mode-real-prices.md.
          python3 - <<'PY'
          import json
          d = json.load(open('duffel.json'))
          offers = d.get('data', {}).get('offers', [])
          if not offers:
              print('NO OFFERS:', json.dumps(d)[:400]); raise SystemExit(0)
          modes = {o.get('live_mode') for o in offers}
          print(f'offers={len(offers)} live_mode={modes} '
                f'currencies={ {o["total_currency"] for o in offers} }')
          cheapest = min(offers, key=lambda o: float(o['total_amount']))
          print('cheapest:', cheapest['total_amount'], cheapest['total_currency'],
                '-', cheapest['owner']['name'])
          print('*** REAL PRICES ***' if modes == {True}
                else '*** TEST/SANDBOX PRICES - not real fares ***')
          PY
        continue-on-error: true

      # Same rationale again: catches a wrong MeloTTS model name/input
      # shape right at deploy time. `-o /dev/null` since the response body
      # is a large base64 audio blob, not worth putting in the Actions log.
      # MeloTTS rejects some `lang` values outright with "8002: Invalid
      # input" (a known, undocumented gap - see
      # github.com/cloudflare/cloudflare-docs/issues/23308), so this probes
      # each language the app would actually ask for rather than assuming.
      # VoiceService only routes a language to the cloud voice if it's in
      # its supported set; this is what keeps that set honest.
      - name: Smoke-test the /ai/tts endpoint (real MeloTTS speech synthesis)
        run: |
          probe() {
            lang="$1"; text="$2"
            status=$(curl -sS -X POST https://marocfly-duffel-proxy.bakr1100.workers.dev/ai/tts \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"$text\",\"lang\":\"$lang\"}" \
              -o "resp_$lang.json" -w '%{http_code}' --max-time 25) || status=000
            size=$(wc -c < "resp_$lang.json")
            if [ "$status" = "200" ] && [ "$size" -gt 1000 ]; then
              echo "lang=$lang OK (${size} bytes of audio)"
            else
              echo "lang=$lang FAILED (HTTP $status): $(head -c 200 "resp_$lang.json")"
            fi
          }
          probe en "Hello world"
          probe fr "Bonjour le monde"
        continue-on-error: true
