name: marocfly_ai
description: >
  Tayarti (طيارتي) - the intelligent travel advisor for the Moroccan
  diaspora. Finds not just the cheapest flight, but the cheapest and
  smartest way home. (Dart package name kept as marocfly_ai - renaming it
  would touch every import statement in the codebase for no user-visible
  benefit.)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local persistence (learned preferences, cached itineraries, offline data)
  shared_preferences: ^2.2.3

  # Push notifications (price alerts, gate changes, boarding calls)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # Account login (email/password) - talks to Firebase's Identity Toolkit
  # REST API directly via `http` below, deliberately not the firebase_auth
  # package (see AuthProvider's doc comment for why: that package hardcodes
  # a popup/redirect resolver that breaks on iOS WebKit).

  # Voice assistant
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Networking (for wiring up real flight / train / LLM APIs later)
  http: ^1.2.2

  # Opens affiliate booking links / official rail sites in the browser
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.2
  google_fonts: ^6.2.1
  audioplayers: ^6.8.1
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
